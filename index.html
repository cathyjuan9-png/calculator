<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">

</head>
<body>
    <main class="calculator">
        <div class="display">0</div>
        <div class="keypad">
            <button class="key key--light">AC</button>
            <button class="key">00</button>
            <button class="key">%</button>
            <button class="key key--accent">&divide;</button>

            <button class="key">7</button>
            <button class="key">8</button>
            <button class="key">9</button>
            <button class="key key--accent">x</button>

            <button class="key">4</button>
            <button class="key">5</button>
            <button class="key">6</button>
            <button class="key key--accent">-</button>

            <button class="key">1</button>
            <button class="key">2</button>
            <button class="key">3</button>
            <button class="key key--accent">+</button>
            
            <button class="key key--zero">0</button>
            <button class="key">.</button>
            <button class="key key--accent">=</button>


        </div>
    </main>




</body>
</html>
